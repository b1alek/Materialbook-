name: Build & Release Materialbook APK

on:
  push:
    branches:
      - fork-main
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.1.0-fork)'
        required: true
        default: 'v1.1.0-fork'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK with Release Keystore (or fallback)
        id: sign_step
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -n 1)
          APKSIGNER="${BUILD_TOOLS_DIR}apksigner"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          
          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "::error::Built APK not found at $UNSIGNED_APK"
            exit 1
          fi

          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi

          OUTPUT_APK="Materialbook_${TAG_NAME}.apk"

          if [ -n "${{ secrets.KEYSTORE_FILE }}" ]; then
            echo "Signing with repository secret keystore..."
            mkdir -p $RUNNER_TEMP/keystores
            echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > $RUNNER_TEMP/keystores/keystore.jks
            $APKSIGNER sign \
              --ks $RUNNER_TEMP/keystores/keystore.jks \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$OUTPUT_APK" \
              "$UNSIGNED_APK"
            rm -f $RUNNER_TEMP/keystores/keystore.jks
            echo "Signed with release keystore successfully."
          else
            echo "::warning::KEYSTORE_FILE secret not found. Using default signed APK."
            cp "$UNSIGNED_APK" "$OUTPUT_APK"
          fi

          sha256sum "$OUTPUT_APK" > "${OUTPUT_APK}.sha256"
          
          # 1. Extract release notes from CHANGELOG.md for the current tag
          CHANGELOG_EXTRACT=$(python3 -c "
import re, sys
try:
    with open('CHANGELOG.md', 'r') as f:
        content = f.read()
    pattern = r'## \[(.*?)\][^\n]*\n(.*?)(?=\n## \[|\Z)'
    matches = list(re.finditer(pattern, content, re.DOTALL))
    for m in matches:
        ver = m.group(1).strip()
        tag = '${TAG_NAME}'.lstrip('v').rstrip('-fork')
        if ver.lstrip('v') == tag or ver in '${TAG_NAME}':
            print(m.group(2).strip())
            sys.exit(0)
    if matches:
        print(matches[0].group(2).strip())
except Exception as e:
    pass
" 2>/dev/null || true)

          # 2. Compute git commit log diff from previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            COMMIT_DIFF=$(git log --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" "${PREV_TAG}..HEAD")
            DIFF_HEADER="### Changes since ${PREV_TAG}"
          else
            COMMIT_DIFF=$(git log -n 10 --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))")
            DIFF_HEADER="### Recent Changes"
          fi

          cat << EOF > release_notes.txt
### Materialbook Fork Release (${TAG_NAME})
* **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
* **Assets:** \`${OUTPUT_APK}\`

EOF

          if [ -n "$CHANGELOG_EXTRACT" ]; then
            cat << EOF >> release_notes.txt
${CHANGELOG_EXTRACT}

EOF
          fi

          cat << EOF >> release_notes.txt
${DIFF_HEADER}
${COMMIT_DIFF}

---
**SHA-256 Checksum:**
\`\`\`
$(cat "${OUTPUT_APK}.sha256")
\`\`\`
EOF

          echo "apk_path=$OUTPUT_APK" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.sign_step.outputs.tag_name }}
          name: Materialbook ${{ steps.sign_step.outputs.tag_name }}
          body_path: release_notes.txt
          files: |
            ${{ steps.sign_step.outputs.apk_path }}
            ${{ steps.sign_step.outputs.apk_path }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign_step.outputs.apk_path }}
          path: |
            ${{ steps.sign_step.outputs.apk_path }}
            ${{ steps.sign_step.outputs.apk_path }}.sha256
          retention-days: 14